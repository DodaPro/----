          icon.classList.remove("fa-sun");
          icon.classList.add("fa-moon");
        }
      }

      function triggerConfetti() {
        var duration = 3000;
        var end = Date.now() + duration;

        (function frame() {
          confetti({
            particleCount: 5,
            angle: 60,
            spread: 55,
            origin: { x: 0 },
            colors: ["#2563eb", "#10b981", "#f59e0b"],
          });
          confetti({
            particleCount: 5,
            angle: 120,
            spread: 55,
            origin: { x: 1 },
            colors: ["#2563eb", "#10b981", "#f59e0b"],
          });

          if (Date.now() < end) {
            requestAnimationFrame(frame);
          }
        })();
      }

      function handleAnswerRecord(isCorrect) {
        if (isCorrect) {
          correctAnswersCount++;
          consecutiveCorrectCount++;
          document.getElementById("score-correct").innerText =
            correctAnswersCount;

          // Trigger Confetti every 3 correct answers
          if (
            consecutiveCorrectCount % 3 === 0 &&
            consecutiveCorrectCount > 0
          ) {
            triggerConfetti();
          }
        } else {
          consecutiveCorrectCount = 0; // Reset streak
        }
      }

      function toggleHint(btn) {
        const hintBox = btn.nextElementSibling;
        hintBox.classList.toggle("hidden");
      }

      // --- Render Functions ---

      function renderMCQ() {
        const container = document.getElementById("section-mcq");
        container.innerHTML = "";

        mcqData.forEach((item, index) => {
          const card = document.createElement("div");
          card.className =
            "bg-white dark:bg-darkCard rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 md:p-8 relative transition-colors";

          // Hint Button
          const hintBtn = `
                    <div class="absolute top-6 left-6 rtl:left-auto rtl:right-6">
                        <button onclick="toggleHint(this)" class="text-orange-500 hover:text-orange-600 bg-orange-50 dark:bg-gray-800 rounded-full p-2 text-sm font-bold transition-colors" title="إظهار تلميح">
                            <i class="fa-solid fa-lightbulb"></i> تلميح
                        </button>
                        <div class="hidden absolute top-full left-0 rtl:left-auto rtl:right-0 mt-2 w-48 bg-orange-100 dark:bg-gray-700 text-orange-800 dark:text-orange-200 text-xs p-3 rounded-lg shadow-lg z-10 border border-orange-200 dark:border-gray-600">
                            ${item.hint}
                        </div>
                    </div>
                `;

          // Question Title
          const qTitle = `<h3 class="text-lg md:text-xl font-bold mb-6 pr-14 text-gray-800 dark:text-gray-100"><span class="text-primary mr-1">${index + 1}.</span> ${item.q}</h3>`;

          // Options
          let optionsHtml = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="options-${item.id}">`;
          item.options.forEach((opt, oIdx) => {
            optionsHtml += `
                        <button onclick="checkMCQ('${item.id}', ${oIdx}, ${item.ans})" class="opt-btn-${item.id} w-full text-right p-4 rounded-xl border-2 border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 hover:bg-blue-50 dark:hover:bg-gray-700 font-semibold text-gray-700 dark:text-gray-200 transition-all focus:outline-none flex justify-between items-center">
                            <span>${opt}</span>
                            <i class="icon-status fa-solid hidden"></i>
                        </button>
                    `;
          });
          optionsHtml += `</div>`;

          // Explanation Box
          const expBox = `
                    <div id="exp-${item.id}" class="hidden mt-6 p-4 rounded-xl bg-blue-50 dark:bg-gray-800 border-r-4 border-primary text-gray-700 dark:text-gray-300 text-sm md:text-base leading-relaxed">
                        <div class="font-bold text-primary mb-2"><i class="fa-solid fa-book-open"></i> التوضيح من المحاضرات:</div>
                        ${item.explanation}
                    </div>
                `;

          card.innerHTML = hintBtn + qTitle + optionsHtml + expBox;
          container.appendChild(card);
        });
      }

      function checkMCQ(qId, selectedIdx, correctIdx) {
        const buttons = document.querySelectorAll(`.opt-btn-${qId}`);
        let isCorrect = selectedIdx === correctIdx;

        buttons.forEach((btn, idx) => {
          btn.classList.add("btn-locked"); // Lock all
          const icon = btn.querySelector(".icon-status");
          icon.classList.remove("hidden");

          if (idx === correctIdx) {
            // Highlight correct option always
            btn.classList.remove(
              "bg-gray-50",
              "dark:bg-gray-800",
              "border-gray-100",
              "dark:border-gray-700",
            );
            btn.classList.add(
              "bg-emerald-100",
              "dark:bg-emerald-900/30",
              "border-emerald-500",
              "text-emerald-800",
              "dark:text-emerald-400",
            );
            icon.classList.add(
              "fa-check",
              "text-emerald-600",
              "dark:text-emerald-400",
            );
          } else if (idx === selectedIdx && !isCorrect) {
            // Highlight selected wrong option
            btn.classList.remove(
              "bg-gray-50",
              "dark:bg-gray-800",
              "border-gray-100",
              "dark:border-gray-700",
            );
            btn.classList.add(
              "bg-red-100",
              "dark:bg-red-900/30",
              "border-red-500",
              "text-red-800",
              "dark:text-red-400",
            );
            icon.classList.add("fa-xmark", "text-red-600", "dark:text-red-400");
          } else {
            icon.classList.add("hidden");
          }
        });

        // Show explanation
        document.getElementById(`exp-${qId}`).classList.remove("hidden");

        handleAnswerRecord(isCorrect);
      }

      function renderTF() {
        const container = document.getElementById("section-tf");
        container.innerHTML = "";

        tfData.forEach((item, index) => {
          const card = document.createElement("div");
          card.className =
            "bg-white dark:bg-darkCard rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 relative transition-colors";

          // Hint Button
          const hintBtn = `
                    <div class="absolute top-6 left-6 rtl:left-auto rtl:right-6">
                        <button onclick="toggleHint(this)" class="text-orange-500 hover:text-orange-600 bg-orange-50 dark:bg-gray-800 rounded-full p-2 text-sm font-bold transition-colors">
                            <i class="fa-solid fa-lightbulb"></i>
                        </button>
                        <div class="hidden absolute top-full left-0 rtl:left-auto rtl:right-0 mt-2 w-48 bg-orange-100 dark:bg-gray-700 text-orange-800 dark:text-orange-200 text-xs p-3 rounded-lg shadow-lg z-10 border border-orange-200 dark:border-gray-600">
                            ${item.hint}
                        </div>
                    </div>
                `;

          const qTitle = `<h3 class="text-lg font-bold mb-6 pr-10 text-gray-800 dark:text-gray-100"><span class="text-primary mr-1">${index + 1}.</span> ${item.q}</h3>`;

          const optionsHtml = `
                    <div class="flex gap-4" id="options-${item.id}">
                        <button onclick="checkTF('${item.id}', true, ${item.ans})" class="opt-btn-tf-${item.id} flex-1 py-3 rounded-xl border-2 border-gray-200 dark:border-gray-600 font-bold text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 transition flex justify-center items-center gap-2">
                            صح <i class="icon-status fa-solid hidden"></i>
                        </button>
                        <button onclick="checkTF('${item.id}', false, ${item.ans})" class="opt-btn-tf-${item.id} flex-1 py-3 rounded-xl border-2 border-gray-200 dark:border-gray-600 font-bold text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 transition flex justify-center items-center gap-2">
                            خطأ <i class="icon-status fa-solid hidden"></i>
                        </button>
                    </div>
                `;

          const expBox = `
                    <div id="exp-tf-${item.id}" class="hidden mt-6 p-4 rounded-xl bg-blue-50 dark:bg-gray-800 border-r-4 border-primary text-gray-700 dark:text-gray-300 text-sm leading-relaxed">
                        <div class="font-bold text-primary mb-1"><i class="fa-solid fa-book-open"></i> التوضيح:</div>
                        ${item.explanation}
                    </div>
                `;

          card.innerHTML = hintBtn + qTitle + optionsHtml + expBox;
          container.appendChild(card);
        });
      }

      function checkTF(qId, selectedVal, correctVal) {
        const buttons = document.querySelectorAll(`.opt-btn-tf-${qId}`);
        let isCorrect = selectedVal === correctVal;

        buttons.forEach((btn, idx) => {
          btn.classList.add("btn-locked");
          const isBtnTrue = idx === 0; // first btn is 'True'
          const icon = btn.querySelector(".icon-status");
          icon.classList.remove("hidden");

          if (isBtnTrue === correctVal) {
            btn.classList.add(
              "bg-emerald-100",
              "dark:bg-emerald-900/30",
              "border-emerald-500",
              "text-emerald-800",
              "dark:text-emerald-400",
            );
            icon.classList.add("fa-check", "text-emerald-600");
          } else if (isBtnTrue === selectedVal && !isCorrect) {
            btn.classList.add(
              "bg-red-100",
              "dark:bg-red-900/30",
              "border-red-500",
              "text-red-800",
              "dark:text-red-400",
            );
            icon.classList.add("fa-xmark", "text-red-600");
          } else {
            icon.classList.add("hidden");
          }
        });

        document.getElementById(`exp-tf-${qId}`).classList.remove("hidden");
        handleAnswerRecord(isCorrect);
      }

      function renderEssay() {
        const container = document.getElementById("section-essay");
        container.innerHTML = "";

        essayData.forEach((item, index) => {
          const card = document.createElement("div");
          card.className =
            "bg-white dark:bg-darkCard rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 md:p-8 transition-colors";

          const qHtml = `
                    <div class="flex items-start gap-3 mb-6">
                        <div class="bg-gray-100 dark:bg-gray-800 text-primary px-3 py-1 rounded-lg font-bold">س ${index + 1}</div>
                        <h3 class="text-lg md:text-xl font-bold text-gray-800 dark:text-gray-100 pt-1">${item.q}</h3>
                    </div>
                    <button onclick="toggleEssayAns('${item.id}', this)" class="bg-primary hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-lg transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-eye"></i> أظهر الحل المعتمد
                    </button>
                    <div id="ans-essay-${item.id}" class="hidden mt-6 overflow-x-auto">
                        ${item.ans}
                    </div>
                `;
          card.innerHTML = qHtml;
          container.appendChild(card);
        });
      }

      function toggleEssayAns(qId, btn) {
        const ansDiv = document.getElementById(`ans-essay-${qId}`);
        if (ansDiv.classList.contains("hidden")) {
          ansDiv.classList.remove("hidden");
          btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i> إخفاء الحل';
          btn.classList.replace("bg-primary", "bg-gray-500");
          btn.classList.replace("hover:bg-blue-700", "hover:bg-gray-600");
        } else {
          ansDiv.classList.add("hidden");
          btn.innerHTML = '<i class="fa-solid fa-eye"></i> أظهر الحل المعتمد';
          btn.classList.replace("bg-gray-500", "bg-primary");
          btn.classList.replace("hover:bg-gray-600", "hover:bg-blue-700");
        }
      }

      // --- Zikr Modal Logic (Every 5 minutes) ---
      const zikrList = [
        "اللهم لا سهل إلا ما جعلته سهلاً، وأنت تجعل الصعب إذا شئت سهلاً.",
        "يا رب اكتب لنا الامتياز والنجاح والتوفيق في هذا المقرر.",
        "اللهم ارزقني قوة الحفظ، وسرعة الفهم، وصفاء الذهن.",
        "اللهم اشرح لي صدري، ويسر لي أمري، واحلل عقدة من لساني يفقهوا قولي.",
        "سبحان الله وبحمده، سبحان الله العظيم.. استمر في تركيزك، أنت بطل!",
      ];

      let zikrIndex = 0;

      function showZikrModal() {
        const modal = document.getElementById("zikr-modal");
        const zikrText = document.getElementById("zikr-text");

        zikrText.innerText = zikrList[zikrIndex];
        zikrIndex = (zikrIndex + 1) % zikrList.length;

        modal.classList.remove("hidden");
      }

      function closeZikrModal() {
        document.getElementById("zikr-modal").classList.add("hidden");
      }

      // Run Init
      window.addEventListener("DOMContentLoaded", initApp);
    </script>
  </body>
</html>
